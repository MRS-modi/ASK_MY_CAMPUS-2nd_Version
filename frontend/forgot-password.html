<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password - Ask My Campus</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/theme.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/pages/auth.css" />
  
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="assets/js/api.js"></script>

  <style>
  body, html { height: 100%; margin: 0; background: #0f172a; font-family: 'Inter', sans-serif; }
  .auth-page { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 40px; }
  
  /* Horizontal Layout */
  .auth-wrap { 
    display: flex; 
    width: 90vw;   /* Screen width ka 90% */
    max-width: 1200px; /* Isse zyada bada nahi hoga */
    height: 80vh;  /* Screen height ka 80% */
    background: #1e293b; 
    border-radius: 24px; 
    overflow: hidden; 
}

  /* Left Side - Info */
  .auth-showcase { 
    flex: 1; 
    padding: 60px; 
    background: #0f172a; 
    display: flex; 
    flex-direction: column; 
    justify-content: center; 
  }

  /* Right Side - Form */
  .auth-form-card { 
    flex: 1; 
    padding: 80px; 
    display: flex; 
    flex-direction: column; 
    justify-content: center; 
  }

  .auth-title { font-size: 2.5rem; font-weight: 800; color: #fff; margin-bottom: 20px; }
  .auth-subtitle { color: #94a3b8; font-size: 1.1rem; margin-bottom: 40px; }
  .auth-input { width: 100%; padding: 18px; background: #0f172a; border: 1px solid #334155; border-radius: 12px; color: #fff; font-size: 1rem; margin-bottom: 20px; box-sizing: border-box; }
  .btn-primary { width: 100%; padding: 18px; background: #8b5cf6; border: none; border-radius: 12px; color: #fff; font-weight: 700; cursor: pointer; }
</style>

<main class="auth-page">
  <div class="auth-wrap">
    <section class="auth-showcase">
      <h1 style="color:#fff; font-size: 2rem;">Ask My Campus</h1>
      <p style="color:#94a3b8; margin-top: 20px;">Forgot your password? No worries, we're here to help you get back to your learning community.</p>
    </section>

    <section class="auth-form-card">
  <div class="auth-title">Reset Password</div>
  <p class="auth-subtitle">Verify your identity to secure your account.</p>
  
  <div class="auth-form" id="resetForm">
    <div id="emailField">
      <label class="auth-label">College Email</label>
      <input id="resetEmail" class="auth-input" type="email" placeholder="username@mitsgwl.ac.in" />
    </div>

    <div id="otpField" style="display:none;">
      <label class="auth-label">Enter OTP</label>
      <input id="resetOtp" class="auth-input" type="text" placeholder="123456" />
    </div>

    <div id="newPassField" style="display:none;">
      <label class="auth-label">New Password</label>
      <input id="newPassword" class="auth-input" type="password" placeholder="••••••••" />
    </div>
    
    <button class="btn-primary" id="mainActionBtn" onclick="handleResetFlow()">Send OTP</button>
    <div id="authMessage" style="margin-top:15px; text-align:center; font-size: 14px;"></div>
  </div>
</section>
  </div>
</main>

  <script>
    let currentStep = 'email';

    async function handleResetFlow() {
        console.log("Button Clicked!");
        
        const msg = document.getElementById("authMessage");
        const btn = document.getElementById("mainActionBtn");
        
        // Element existence check
        if (!msg) {
            console.error("Error: authMessage div not found in DOM!");
            return;
        }

        msg.textContent = "Processing...";
        msg.style.color = "#94a3b8"; // Default color

        try {
            if (currentStep === 'email') {
                const email = document.getElementById("resetEmail")?.value;
                if (!email) throw new Error("Please enter your college email.");
                
                await apiRequest("/auth/forgot-password", "POST", { email });
                
                currentStep = 'otp';
                document.getElementById("emailField").style.display = 'none';
                document.getElementById("otpField").style.display = 'block';
                btn.textContent = "Verify OTP";
                msg.textContent = "OTP sent to your email!";
                msg.style.color = "#10b981";
            } 
            else if (currentStep === 'otp') {
                const email = document.getElementById("resetEmail").value;
                const otp = document.getElementById("resetOtp")?.value;
                if (!otp) throw new Error("Please enter the OTP.");
                
                await apiRequest("/auth/verify-otp", "POST", { email, otp });
                
                currentStep = 'password';
                document.getElementById("otpField").style.display = 'none';
                document.getElementById("newPassField").style.display = 'block';
                btn.textContent = "Update Password";
                msg.textContent = "OTP verified!";
                msg.style.color = "#10b981";
            }
            else if (currentStep === 'password') {
                const email = document.getElementById("resetEmail").value;
                const password = document.getElementById("newPassword")?.value;
                if (!password || password.length < 6) throw new Error("Password must be at least 6 characters.");
                
                await apiRequest("/auth/update-password", "POST", { email, password });
                
                await Swal.fire({
                    title: 'Success!',
                    text: 'Password updated successfully!',
                    icon: 'success',
                    background: '#1e293b',
                    color: '#fff'
                });
                window.location.href = "login.html";
            }
        } catch (err) {
            console.error("Error:", err);
            msg.textContent = err.message || "Something went wrong.";
            msg.style.color = "#f87171"; // Error red
        }
    }
</script>
</body>
</html>
