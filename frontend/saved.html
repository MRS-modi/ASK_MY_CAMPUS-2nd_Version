<!DOCTYPE html>
<html lang="en">
<head>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script> 
  
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ask My Campus - Saved Questions</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/theme.css" />
  <link rel="stylesheet" href="assets/css/layout.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/pages/home.css" />

  <script src="assets/js/darkmode.js"></script>
  <script src="assets/js/ui.js" defer></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/questions.js?v=1.2"></script>
</head>
<body>
  <div class="app-shell">
    <div id="sidebarMount"></div>

    <div class="main-shell">
      <div id="navbarMount"></div>

      <main class="page-content">
        <div class="hero-card" style="margin-bottom:24px;">
          <h1 class="hero-title" style="font-size:2rem;">Saved Questions</h1>
          <p class="hero-text">
            Your bookmarked questions are stored here for quick access.
          </p>
        </div>

        <section>
          <div class="home-header-row">
            <div>
              <h2 class="section-title" style="margin-bottom:0;">Your Saved List</h2>
              <p class="section-subtitle">Questions you saved will appear here.</p>
            </div>
          </div>

          <div id="savedQuestionsList"></div>
        </section>
      </main>
    </div>
  </div>

  <script>
document.addEventListener("DOMContentLoaded", async () => {
    // 1. Layout Load (Isse sabse pehle rakho)
    await loadBaseLayout(); 

    // 2. Auth Check
    if (!localStorage.getItem("token")) { window.location.href = "/pages/login.html"; return; }

    // 3. API Calls (Ye try-catch mein honi chahiye)
    try {
        await loadSavedQuestions(); 
    } catch (e) {
        console.error("API Error: ", e);
    }
});
</script>
</body>
</html>
