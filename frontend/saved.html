<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ask My Campus - Saved Questions</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/theme.css" />
  <link rel="stylesheet" href="assets/css/layout.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/pages/home.css" />

  <script src="assets/js/darkmode.js"></script>
  <script src="assets/js/ui.js" defer></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/questions.js"></script>
</head>
<body>
  <div class="app-shell">
    <div id="sidebarMount"></div>

    <div class="main-shell">
      <div id="navbarMount"></div>

      <main class="page-content">
        <div class="hero-card" style="margin-bottom:24px;">
          <h1 class="hero-title" style="font-size:2rem;">Saved Questions</h1>
          <p class="hero-text">
            Your bookmarked questions are stored here for quick access.
          </p>
        </div>

        <section>
          <div class="home-header-row">
            <div>
              <h2 class="section-title" style="margin-bottom:0;">Your Saved List</h2>
              <p class="section-subtitle">Questions you saved will appear here.</p>
            </div>
          </div>

          <div id="savedQuestionsList"></div>
        </section>
      </main>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (typeof loadSavedQuestions === "function") {
        loadSavedQuestions();
      }
    });
  </script>
</body>
</html>
