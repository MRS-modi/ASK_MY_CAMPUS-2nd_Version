<!DOCTYPE html>
<html lang="en">
<head>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ask My Campus - Leaderboard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/theme.css" />
  <link rel="stylesheet" href="assets/css/layout.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/pages/home.css" /> 

  <script src="assets/js/darkmode.js"></script>
  <script src="assets/js/ui.js" defer></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/leaderboard.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <div id="sidebarMount"></div>

    <div class="main-shell">
      <div id="navbarMount"></div>

      <main class="page-content">
        <section class="home-top">
          <div class="hero-card" style="background: linear-gradient(135deg, #1e1b4b 0%, #311042 100%);">
            <h1 class="hero-title">Campus Top Contributors 🏆</h1>
            <p class="hero-text">
              Meet the brilliant minds helping the campus grow. Answer doubts, get upvotes, and earn verified badges to climb up the leaderboard!
            </p>
          </div>
        </section>

        <section class="home-section" style="margin-top: 24px;">
          <div class="card" style="padding: 24px; background: var(--bg-card); border: 1px solid var(--border-color);">
            <h2 class="section-title" style="margin-bottom: 16px;">Rankings</h2>
            
            <div style="overflow-x: auto;">
              <table style="width: 100%; border-collapse: collapse; text-align: left; color: var(--text-main);">
                <thead>
                  <tr style="border-bottom: 2px solid var(--border-color); color: var(--text-soft); font-size: 14px;">
                    <th style="padding: 12px 8px;">Rank</th>
                    <th style="padding: 12px 8px;">Name</th>
                    <th style="padding: 12px 8px;">Branch / Year</th>
                    <th style="padding: 12px 8px;">Role</th>
                    <th style="padding: 12px 8px; text-align: right;">Reputation Points</th>
                  </tr>
                </thead>
                <tbody id="leaderboardRows">
                  <tr>
                    <td colspan="5" style="padding: 24px; text-align: center; color: var(--text-soft);">Loading leaderboard data...</td>
                  </tr>
                </tbody>
              </table>
            </div>

          </div>
        </section>
      </main>
    </div>
  </div>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
        // Layout load karo
        await loadBaseLayout();

        // Auth Guard
        const token = localStorage.getItem("token");
        if (!token && window.location.pathname.indexOf("login.html") === -1) {
            window.location.href = "login.html";
            return;
        }

        // Page specific initialization
        if (typeof initFilters === 'function') await initFilters();
        if (typeof loadQuestions === 'function' && document.getElementById("questionsList")) await loadQuestions("recent");
        if (typeof loadAcademicCalendar === 'function') await loadAcademicCalendar();
    });
</script>
</body>
</html>
