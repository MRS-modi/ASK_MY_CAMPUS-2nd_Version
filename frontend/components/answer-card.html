<div class="answer-card">

  <div class="answer-header">
    <span class="answer-author">{{author}}</span>
    <span class="answer-date">{{date}}</span>
  </div>

  <p class="answer-content">
    {{content}}
  </p>

  <div class="answer-actions">
    <button class="btn-small">Upvote</button>
  </div>

</div>
