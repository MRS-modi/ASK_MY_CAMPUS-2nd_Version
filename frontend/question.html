<!DOCTYPE html>
<html lang="en">
<head>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ask My Campus - Question Details</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/theme.css" />
  <link rel="stylesheet" href="assets/css/layout.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/pages/question.css" />

  <script src="assets/js/darkmode.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="utils/roleGuard.js"></script>
  <script src="assets/js/ui.js" defer></script>
  <script src="assets/js/questions.js" defer></script> 
  <script src="assets/js/answers.js"></script>
</head>
<body>
  <div class="app-shell">
    <div id="sidebarMount"></div>

    <div class="main-shell">
      <div id="navbarMount"></div>

      <main class="page-content">
        <div class="question-layout">
          
          <div id="studentViewQuestionClaimStatusMount"></div>

          <section id="questionData" class="card detail-card">
            Loading question...
          </section>

          <section class="card answer-editor">
            <h2 class="section-title" style="font-size:1.4rem; margin-bottom:14px;">Write Your Answer</h2>
            <textarea id="answerText" placeholder="Write a clear and helpful answer..."></textarea>
            <div style="margin-top:16px; display:flex; gap:12px; flex-wrap:wrap;">
              <button class="btn-primary" onclick="postAnswer()">Submit Answer</button>
            </div>
            <div id="answerMessage" class="message-text"></div>
          </section>

          <section>
            <div class="home-header-row" style="margin-bottom:18px;">
              <div>
                <h2 class="section-title" style="margin-bottom:0;">Answers</h2>
                <p class="section-subtitle">Community responses appear here.</p>
              </div>
            </div>
            <div id="answersList" style="display:flex; flex-direction:column; gap:18px;"></div>
          </section>
        </div>
      </main>
    </div>
  </div>
</body>
<script>
document.addEventListener("DOMContentLoaded", async () => {
    await loadBaseLayout();

    if (!localStorage.getItem("token")) {
        window.location.href = "/pages/login.html";
        return;
    }

    const urlParams = new URLSearchParams(window.location.search);
    const questionId = urlParams.get('id');

    if (questionId) {
        try {
            if (typeof loadQuestionDetails === 'function') {
                await loadQuestionDetails(questionId);
            }
            if (typeof loadAnswers === 'function') {
                await loadAnswers(questionId);
            }
        } catch (err) {
            console.error("Data load error:", err);
            const container = document.getElementById("questionData");
            if (container) container.innerHTML = `<p style="color:#f87171;">Question load nahi ho saka.</p>`;
        }
    } else {
        console.error("URL mein question ID missing hai!");
    }
});

async function postAnswer() {
    const answerText = document.getElementById("answerText").value.trim();
    const messageDiv = document.getElementById("answerMessage");
    const urlParams = new URLSearchParams(window.location.search);
    const questionId = urlParams.get('id');

    if (!answerText) {
        if (messageDiv) messageDiv.textContent = "Answer likhna zaruri hai.";
        return;
    }

    try {
        if (messageDiv) messageDiv.textContent = "Posting...";
        await apiRequest(`/questions/${questionId}/answers`, "POST", { content: answerText });
        
        await Swal.fire({ icon: 'success', title: 'Posted!', text: 'Answer submit ho gaya.', timer: 1500 });
        
        const textEl = document.getElementById("answerText");
        if (textEl) textEl.value = "";
        if (typeof loadAnswers === 'function') await loadAnswers(questionId);
    } catch (err) {
        if (messageDiv) messageDiv.textContent = "Failed to post answer.";
        console.error(err);
    }
}
</script>
</html>
