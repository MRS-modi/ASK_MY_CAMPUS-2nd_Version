<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ask My Campus - Ask Question</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/theme.css" />
  <link rel="stylesheet" href="assets/css/layout.css" />
  <link rel="stylesheet" href="assets/css/components.css" />

  <script src="assets/js/darkmode.js"></script>
  <script src="assets/js/ui.js" defer></script>
  <script src="assets/js/api.js"></script>
</head>
<body>
  <div class="app-shell">
    <div id="sidebarMount"></div>

    <div class="main-shell">
      <div id="navbarMount"></div>

      <main class="page-content">
        <div class="hero-card" style="margin-bottom:24px;">
          <h1 class="hero-title" style="font-size:2rem;">Ask a Question</h1>
          <p class="hero-text">
            Write a clear title, describe your doubt properly, and add tags so the right people can help you faster.
          </p>
        </div>

        <div class="card" style="max-width:980px;">
          <div style="display:flex;flex-direction:column;gap:18px;">
            <div>
              <label style="display:block;margin-bottom:8px;font-weight:600;">Question Title</label>
              <input
                id="title"
                type="text"
                placeholder="e.g. How to prepare for first semester practical exam?"
                style="width:100%;padding:14px 16px;border:1px solid rgba(255,255,255,0.08);border-radius:14px;background:rgba(255,255,255,0.04);"
              />
            </div>

            <div>
              <label style="display:block;margin-bottom:8px;font-weight:600;">Description</label>
              <textarea
                id="content"
                placeholder="Explain your doubt..."
                style="width:100%;height:180px;padding:14px 16px;border:1px solid rgba(255,255,255,0.08);border-radius:14px;background:rgba(255,255,255,0.04);resize:vertical;"
              ></textarea>
            </div>

            <div>
              <label style="display:block;margin-bottom:8px;font-weight:600;">Subject</label>
              <input
                id="subject"
                type="text"
                placeholder="e.g. Academics"
                style="width:100%;padding:14px 16px;border:1px solid rgba(255,255,255,0.08);border-radius:14px;background:rgba(255,255,255,0.04);"
              />
            </div>

            <div>
              <label style="display:block;margin-bottom:8px;font-weight:600;">Tags</label>
              <input
                id="tags"
                type="text"
                placeholder="e.g. exam, practical, first-year"
                style="width:100%;padding:14px 16px;border:1px solid rgba(255,255,255,0.08);border-radius:14px;background:rgba(255,255,255,0.04);"
              />
            </div>

            <div style="display:flex;gap:14px;flex-wrap:wrap;">
              <button class="btn-primary" onclick="submitQuestion()">Post Question</button>
              <a href="index.html" class="btn-secondary">Cancel</a>
            </div>

            <div id="askMessage" style="margin-top:8px;color:#94a3b8;"></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script>
    async function submitQuestion() {
      const title = document.getElementById("title").value.trim();
      const content = document.getElementById("content").value.trim();
      const subject = document.getElementById("subject").value.trim();
      const tags = document.getElementById("tags").value.trim();
      const askMessage = document.getElementById("askMessage");

      askMessage.textContent = "";

      if (!title || !content) {
        askMessage.textContent = "Title and description are required.";
        return;
      }

      const token = localStorage.getItem("token");
      if (!token) {
        askMessage.textContent = "You must login first before posting a question.";
        return;
      }

      try {
        await apiRequest("/questions", "POST", {
          title,
          content,
          subject: subject || null,
          tags: tags || null
        });

        askMessage.textContent = "Question posted successfully.";
        setTimeout(() => {
          window.location.href = "index.html";
        }, 700);
      } catch (error) {
        askMessage.textContent = error.message || "Failed to post question.";
      }
    }
  </script>
</body>
</html>
